name: Issue 自动分流

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 分类
        id: triage
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 tools/issue_triage.py > result.json
          echo "labels=$(python3 -c "import json;print(','.join(json.load(open('result.json'))['labels']))")" >> "$GITHUB_OUTPUT"
          python3 -c "import json;open('comment.md','w').write(json.load(open('result.json'))['comment'])"

      - name: 打标签并评论
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for l in bug enhancement question documentation needs-triage needs-info; do
            gh label create "$l" --repo ${{ github.repository }} --force || true
          done
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "${{ steps.triage.outputs.labels }}"
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file comment.md
